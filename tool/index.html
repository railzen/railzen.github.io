<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>迷你工具箱</title>
<style>
  :root {
    --bg: #f7f9fc;
    --surface: #ffffff;
    --border: #dfe6f0;
    --text: #172033;
    --text-secondary: #68758a;
    --accent: #2563eb;
    --accent-hover: #1d4ed8;
    --accent-soft: #eff6ff;
    --success: #16a34a;
    --success-soft: #f0fdf4;
    --shadow: rgba(37, 99, 235, .08);
    --radius: 12px;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0b1120;
      --surface: #121a2b;
      --border: #26344c;
      --text: #edf3fc;
      --text-secondary: #96a4ba;
      --accent: #60a5fa;
      --accent-hover: #93c5fd;
      --accent-soft: #172554;
      --success: #4ade80;
      --success-soft: #14261c;
      --shadow: rgba(0, 0, 0, .24);
    }
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", "PingFang SC", "Microsoft YaHei", sans-serif;
    background:
      radial-gradient(circle at 50% 0, var(--accent-soft) 0, transparent 34rem),
      var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 16px;
    line-height: 1.5;
  }
  .wrap { width: 100%; max-width: 640px; }
  header { text-align: center; margin-bottom: 28px; }
  header h1 {
    font-size: 24px; font-weight: 700; letter-spacing: .5px;
    color: var(--text);
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px;
    margin-bottom: 20px;
    box-shadow: 0 10px 30px var(--shadow);
  }
  .card-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; gap: 12px; flex-wrap: wrap; }
  .card-title { font-size: 16px; font-weight: 600; }

  /* 长度分段选择器 */
  .seg { display: inline-flex; background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 3px; }
  .seg button {
    border: none; background: transparent; color: var(--text-secondary);
    font: inherit; font-size: 13px; padding: 5px 12px; border-radius: 8px;
    cursor: pointer; transition: background .15s ease, color .15s ease;
  }
  .seg button.active { background: var(--surface); color: var(--accent); font-weight: 600; box-shadow: 0 1px 2px rgba(16,24,40,.12); }

  .output-row { display: flex; gap: 10px; align-items: stretch; }
  .output {
    flex: 1; min-width: 0;
    font-family: var(--mono); font-size: 15px;
    background: var(--bg); border: 1px solid var(--border); border-radius: 10px;
    padding: 12px 14px; display: flex; align-items: center;
    overflow-x: auto; white-space: nowrap; user-select: all;
  }
  .output.segmented { user-select: text; cursor: text; }
  .output::-webkit-scrollbar { height: 6px; }
  .output::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  .icon-btn {
    flex: none; width: 44px; border: 1px solid var(--border); background: var(--surface);
    border-radius: 10px; cursor: pointer; color: var(--text-secondary);
    display: inline-flex; align-items: center; justify-content: center;
    position: relative;
    transition: color .15s ease, border-color .15s ease, background .15s ease, transform .1s ease;
  }
  .icon-btn:hover { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }
  .icon-btn:active { transform: scale(.94); }
  .icon-btn svg { width: 18px; height: 18px; display: block; }

  .icon-btn.copied {
    color: var(--success);
    border-color: var(--success);
    background: var(--success-soft);
  }
  .icon-btn.copied svg { opacity: 0; }
  .icon-btn.copied::after {
    content: "✓";
    position: absolute;
    font-size: 18px;
    font-weight: 700;
    line-height: 1;
  }
  .icon-btn.refreshing svg { animation: spin .5s ease; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .hint { margin-top: 12px; font-size: 12px; color: var(--text-secondary); }

  /* Base64 编解码 */
  .codec-fields { display: grid; gap: 14px; }
  .field-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 7px; }
  .field-label { font-size: 13px; font-weight: 600; color: var(--text-secondary); }
  .codec-textarea {
    display: block; width: 100%; min-height: 108px; resize: vertical;
    padding: 12px 14px; border: 1px solid var(--border); border-radius: 10px;
    background: var(--bg); color: var(--text); font: 14px/1.6 var(--mono);
    outline: none; transition: border-color .15s ease, box-shadow .15s ease, background .15s ease;
  }
  .codec-textarea::placeholder { color: var(--text-secondary); opacity: .72; }
  .codec-textarea:focus {
    border-color: var(--accent);
    background: var(--surface);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }
  .codec-actions {
    display: flex; align-items: center; gap: 8px; flex-wrap: nowrap;
    overflow-x: auto; padding-bottom: 2px;
  }
  .action-btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 5px; flex: none;
    min-height: 38px; padding: 8px 14px; border: 1px solid var(--border); border-radius: 9px;
    background: var(--surface); color: var(--text); font: inherit; font-size: 13px; font-weight: 600;
    cursor: pointer; transition: color .15s ease, border-color .15s ease, background .15s ease, transform .1s ease;
  }
  .action-btn svg { width: 15px; height: 15px; }
  .action-btn:hover { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }
  .action-btn:active { transform: scale(.97); }
  .action-btn.primary { color: #fff; border-color: var(--accent); background: var(--accent); }
  .action-btn.primary:hover { color: #fff; border-color: var(--accent-hover); background: var(--accent-hover); }
  .codec-copy { width: 34px; height: 34px; }
  .url-inline { display: flex; align-items: stretch; gap: 8px; }
  .url-inline-input {
    flex: 1; min-width: 0; height: 40px; padding: 8px 12px;
    border: 1px solid var(--border); border-radius: 9px;
    background: var(--bg); color: var(--text); font: 14px var(--mono);
    outline: none; transition: border-color .15s ease, box-shadow .15s ease, background .15s ease;
  }
  .url-inline-input:focus {
    border-color: var(--accent); background: var(--surface);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }
  .url-inline .action-btn { min-height: 40px; }
  .url-result { display: none; margin-top: 14px; }
  .url-result.show { display: block; }
  .visually-hidden {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
  }

  /* 其他工具导航 */
  .nav-section-title { font-size: 13px; font-weight: 600; color: var(--text-secondary); margin: 4px 2px 12px; letter-spacing: .5px; }
  .tool-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
  .tool-link {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 14px 16px; background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); text-decoration: none; color: var(--text);
    transition: border-color .15s ease, background .15s ease, transform .1s ease;
  }
  .tool-link:hover { border-color: var(--accent); background: var(--accent-soft); }
  .tool-link:active { transform: scale(.99); }
  .tool-link .name { font-size: 14px; font-weight: 600; }
  .tool-link .desc { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }
  .tool-link .arrow { flex: none; color: var(--text-secondary); transition: color .15s ease, transform .15s ease; }
  .tool-link:hover .arrow { color: var(--accent); transform: translateX(3px); }
  .tool-link .arrow svg { width: 18px; height: 18px; display: block; }

  /* 轻提示 */
  .toast {
    position: fixed; left: 50%; top: 32px; transform: translateX(-50%) translateY(-16px);
    background: var(--text); color: var(--surface); font-size: 13px;
    padding: 9px 16px; border-radius: 8px; opacity: 0; pointer-events: none;
    transition: opacity .2s ease, transform .2s ease;
  }
  .toast.show { opacity: .95; transform: translateX(-50%) translateY(0); }

  footer { text-align: center; color: var(--text-secondary); font-size: 12px; margin-top: 8px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>迷你工具箱</h1>
  </header>

  <!-- UUID 生成器 -->
  <section class="card">
    <div class="card-head">
      <span class="card-title">UUID</span>
      <div class="seg" id="uuidVerSeg" role="group" aria-label="UUID 版本">
        <button type="button" data-ver="1">V1</button>
        <button type="button" data-ver="4" class="active">V4</button>
        <button type="button" data-ver="7">V7</button>
      </div>
    </div>
    <div class="output-row">
      <div class="output" id="uuidOutput">—</div>
      <button class="icon-btn" id="uuidCopy" title="复制" aria-label="复制 UUID">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
      </button>
      <button class="icon-btn" id="uuidRefresh" title="重新生成" aria-label="重新生成 UUID">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><polyline points="21 3 21 9 15 9"/></svg>
      </button>
    </div>
  </section>

  <!-- 密码生成器 -->
  <section class="card">
    <div class="card-head">
      <span class="card-title">随机密码</span>
      <div class="seg" id="lenSeg" role="group" aria-label="密码长度">
        <button data-len="12">12 位</button>
        <button data-len="16" class="active">16 位</button>
        <button data-len="24">24 位</button>
      </div>
    </div>
    <div class="output-row">
      <div class="output" id="pwdOutput">—</div>
      <button class="icon-btn" id="pwdCopy" title="复制" aria-label="复制密码">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
      </button>
      <button class="icon-btn" id="pwdRefresh" title="重新生成" aria-label="重新生成密码">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><polyline points="21 3 21 9 15 9"/></svg>
      </button>
    </div>
  </section>

  <!-- Base64 编解码 -->
  <section class="card">
    <div class="card-head">
      <span class="card-title">Base64 编解码</span>
    </div>
    <div class="codec-fields">
      <div>
        <div class="field-head">
          <label class="field-label" for="base64Input">请输入要进行 Base64 编码或解码的内容</label>
        </div>
        <textarea class="codec-textarea" id="base64Input"></textarea>
      </div>
      <div class="codec-actions">
        <button class="action-btn primary" id="base64Encode" type="button">编码</button>
        <button class="action-btn" id="base64Decode" type="button">解码</button>
        <button class="action-btn" id="base64Swap" type="button">
          <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 8 4-4 4 4"/><path d="M7 4v16"/><path d="m21 16-4 4-4-4"/><path d="M17 20V4"/></svg>
          交换
        </button>
        <button class="action-btn" id="base64FileEncode" type="button">编码文件</button>
        <button class="action-btn" id="base64FileDecode" type="button">解码为文件</button>
        <input class="visually-hidden" id="base64FileInput" type="file" tabindex="-1">
      </div>
      <div>
        <div class="field-head">
          <label class="field-label" for="base64Output">Base64 编码或解码结果</label>
          <button class="icon-btn codec-copy" id="base64Copy" type="button" title="复制结果" aria-label="复制 Base64 处理结果">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
          </button>
        </div>
        <textarea class="codec-textarea" id="base64Output"></textarea>
      </div>
    </div>
    <p class="hint">Ctrl + Enter 编码 · 文件上限 10 MiB · 文本和文件都仅在本地处理，不会上传。</p>
  </section>

  <!-- URL 编解码 -->
  <section class="card">
    <div class="card-head">
      <span class="card-title">URL 编解码</span>
    </div>
    <div class="url-inline">
      <input class="url-inline-input" id="urlInput" type="text" aria-label="请输入要进行 URL 编码或解码的内容">
      <button class="action-btn" id="urlEncode" type="button">编码</button>
      <button class="action-btn" id="urlDecode" type="button">解码</button>
    </div>
    <div class="url-result" id="urlResult">
      <div class="field-head">
        <label class="field-label" for="urlOutput">URL 编码或解码结果</label>
        <button class="icon-btn codec-copy" id="urlCopy" type="button" title="复制结果" aria-label="复制 URL 处理结果">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        </button>
      </div>
      <textarea class="codec-textarea" id="urlOutput"></textarea>
    </div>
  </section>

  <!-- 其他工具导航 -->
  <p class="nav-section-title">其他工具</p>
  <nav class="tool-grid">
    <a class="tool-link" href="./killtraffic">
      <span>
        <span class="name">流量消耗</span>
        <div class="desc">蜂窝 / 网络测速流量统计</div>
      </span>
      <span class="arrow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg></span>
    </a>
    <a class="tool-link" href="./calc_dbi">
      <span>
        <span class="name">空口衰减计算</span>
        <div class="desc">无线传输损耗计算</div>
      </span>
      <span class="arrow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg></span>
    </a>
    <a class="tool-link" href="./cloudvalue-calculation">
      <span>
        <span class="name">剩余价值计算</span>
        <div class="desc">云服务剩余价值计算器</div>
      </span>
      <span class="arrow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg></span>
    </a>
  </nav>
</div>

<script>
(function () {
  'use strict';

  // Base58（比特币字母表）：去掉 0 O I l 的数字与大小写字母，外加指定符号
  var CHARSET = '123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz!@#$%&';

  var uuidOutput = document.getElementById('uuidOutput');
  var pwdOutput  = document.getElementById('pwdOutput');
  var base64Input = document.getElementById('base64Input');
  var base64Output = document.getElementById('base64Output');
  var urlInput = document.getElementById('urlInput');
  var urlOutput = document.getElementById('urlOutput');
  var urlResult = document.getElementById('urlResult');
  var base64FileInput = document.getElementById('base64FileInput');
  var MAX_FILE_SIZE = 10 * 1024 * 1024;
  var lastEncodedFileData = '';
  var lastEncodedFileName = '';
  var pwdLen = 16;
  var uuidVer = 4;

  /* ---------- 生成逻辑 ---------- */

  // 加密安全的随机整数 [0, max)，使用拒绝采样避免模偏差
  function randomInt(max) {
    var range = 256 - (256 % max);
    var buf = new Uint8Array(1);
    var b;
    do {
      crypto.getRandomValues(buf);
      b = buf[0];
    } while (b >= range);
    return b % max;
  }

  function bytesToUUID(bytes) {
    var hex = [];
    for (var i = 0; i < 16; i++) hex.push(('0' + bytes[i].toString(16)).slice(-2));
    return hex.slice(0, 4).join('') + '-' + hex.slice(4, 6).join('') + '-' +
           hex.slice(6, 8).join('') + '-' + hex.slice(8, 10).join('') + '-' +
           hex.slice(10, 16).join('');
  }

  // v1：时间戳 + 时钟序列 + 随机节点（组播位）
  function generateUUIDv1() {
    var now = Date.now();
    var timeLow, timeMid, timeHi;
    if (typeof BigInt !== 'undefined') {
      var time = BigInt(now) * 10000n + 0x01B21DD213814000n;
      timeLow = Number(time & 0xffffffffn);
      timeMid = Number((time >> 32n) & 0xffffn);
      timeHi = Number((time >> 48n) & 0x0fffn) | 0x1000;
    } else {
      // 无 BigInt 时按毫秒近似拆分（精度略降）
      var t = now * 10000 + 122192928000000000;
      timeLow = t % 0x100000000;
      timeMid = Math.floor(t / 0x100000000) & 0xffff;
      timeHi = (Math.floor(t / 0x1000000000000) & 0x0fff) | 0x1000;
    }
    var clockSeq = new Uint8Array(2);
    var node = new Uint8Array(6);
    crypto.getRandomValues(clockSeq);
    crypto.getRandomValues(node);
    node[0] |= 0x01;
    var bytes = new Uint8Array(16);
    bytes[0] = (timeLow >>> 24) & 0xff;
    bytes[1] = (timeLow >>> 16) & 0xff;
    bytes[2] = (timeLow >>> 8) & 0xff;
    bytes[3] = timeLow & 0xff;
    bytes[4] = (timeMid >>> 8) & 0xff;
    bytes[5] = timeMid & 0xff;
    bytes[6] = (timeHi >>> 8) & 0xff;
    bytes[7] = timeHi & 0xff;
    bytes[8] = (clockSeq[0] & 0x3f) | 0x80;
    bytes[9] = clockSeq[1];
    for (var i = 0; i < 6; i++) bytes[10 + i] = node[i];
    return bytesToUUID(bytes);
  }

  function generateUUIDv4() {
    if (crypto.randomUUID) return crypto.randomUUID();
    var bytes = new Uint8Array(16);
    crypto.getRandomValues(bytes);
    bytes[6] = (bytes[6] & 0x0f) | 0x40;
    bytes[8] = (bytes[8] & 0x3f) | 0x80;
    return bytesToUUID(bytes);
  }

  // v7：Unix 毫秒时间戳（48 bit）+ 随机位（RFC 9562）
  function generateUUIDv7() {
    var bytes = new Uint8Array(16);
    crypto.getRandomValues(bytes);
    var ts = Date.now();
    for (var i = 5; i >= 0; i--) {
      bytes[i] = ts & 0xff;
      ts = Math.floor(ts / 256);
    }
    bytes[6] = (bytes[6] & 0x0f) | 0x70;
    bytes[8] = (bytes[8] & 0x3f) | 0x80;
    return bytesToUUID(bytes);
  }

  function generateUUID() {
    if (uuidVer === 1) return generateUUIDv1();
    if (uuidVer === 7) return generateUUIDv7();
    return generateUUIDv4();
  }

  function generatePassword(len) {
    var out = '';
    for (var i = 0; i < len; i++) out += CHARSET.charAt(randomInt(CHARSET.length));
    return out;
  }

  function encodeBase64(text) {
    var bytes = new TextEncoder().encode(text);
    var binary = '';
    var chunkSize = 0x8000;
    for (var i = 0; i < bytes.length; i += chunkSize) {
      binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunkSize));
    }
    return btoa(binary);
  }

  function parseBase64Source(text) {
    var source = text.trim();
    var mime = 'application/octet-stream';
    if (source.slice(0, 5).toLowerCase() === 'data:') {
      var comma = source.indexOf(',');
      if (comma < 0) throw new Error('Invalid Data URI');
      var metadata = source.slice(5, comma);
      if (!/(?:^|;)base64(?:;|$)/i.test(metadata)) throw new Error('Not Base64 Data URI');
      var mimePart = metadata.split(';')[0];
      if (mimePart) mime = mimePart;
      source = source.slice(comma + 1);
    }
    var normalized = source.replace(/\s+/g, '').replace(/-/g, '+').replace(/_/g, '/');
    if (!normalized) return { base64: '', mime: mime, byteLength: 0 };
    if (!/^[A-Za-z0-9+/]*={0,2}$/.test(normalized) || normalized.length % 4 === 1) {
      throw new Error('Invalid Base64');
    }
    while (normalized.length % 4) normalized += '=';
    var padding = normalized.slice(-2) === '==' ? 2 : (normalized.slice(-1) === '=' ? 1 : 0);
    return {
      base64: normalized,
      mime: mime,
      byteLength: (normalized.length * 3 / 4) - padding
    };
  }

  function decodeBase64(text) {
    var parsed = parseBase64Source(text);
    var binary = atob(parsed.base64);
    var bytes = new Uint8Array(binary.length);
    for (var i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
    return new TextDecoder('utf-8', { fatal: true }).decode(bytes);
  }

  function extensionForMime(mime) {
    var extensions = {
      'image/png': '.png', 'image/jpeg': '.jpg', 'image/gif': '.gif', 'image/webp': '.webp',
      'image/svg+xml': '.svg', 'application/pdf': '.pdf', 'application/json': '.json',
      'text/plain': '.txt', 'text/html': '.html', 'text/css': '.css',
      'application/zip': '.zip', 'audio/mpeg': '.mp3', 'video/mp4': '.mp4'
    };
    return extensions[mime.toLowerCase()] || '.bin';
  }

  function downloadBase64File(source) {
    var parsed = parseBase64Source(source);
    if (parsed.byteLength > MAX_FILE_SIZE) throw new Error('File too large');
    var binary = atob(parsed.base64);
    var bytes = new Uint8Array(binary.length);
    for (var i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
    var blob = new Blob([bytes], { type: parsed.mime });
    var url = URL.createObjectURL(blob);
    var link = document.createElement('a');
    link.href = url;
    link.download = source === lastEncodedFileData && lastEncodedFileName
      ? lastEncodedFileName
      : 'decoded-file' + extensionForMime(parsed.mime);
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  }

  /* ---------- 交互 ---------- */

  function refreshUUID() {
    var uuid = generateUUID();
    uuidOutput.classList.add('segmented');
    uuidOutput.innerHTML = uuid.split('-').map(function (seg, i) {
      var sep = i > 0 ? '<span class="uuid-dash">-</span>' : '';
      return sep + '<span class="uuid-seg">' + seg + '</span>';
    }).join('');
  }
  function refreshPassword() { pwdOutput.textContent = generatePassword(pwdLen); }

  // 双击 UUID 时只选中所在的"-"分段，而不是整个 UUID
  uuidOutput.addEventListener('dblclick', function (e) {
    var seg = e.target.closest ? e.target.closest('.uuid-seg') : null;
    if (!seg) return;
    e.preventDefault();
    var range = document.createRange();
    range.selectNodeContents(seg);
    var sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
  });

  function bindRefresh(btnId, fn) {
    var btn = document.getElementById(btnId);
    btn.addEventListener('click', function () {
      fn();
      btn.classList.remove('refreshing');
      void btn.offsetWidth; // 重新触发动画
      btn.classList.add('refreshing');
    });
  }

  var toastTimer = null;
  function showToast(msg) {
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove('show'); }, 600);
  }

  function copyText(text, btn) {
    function done() {
      btn.classList.add('copied');
      setTimeout(function () { btn.classList.remove('copied'); }, 500);
      showToast('已复制到剪贴板');
    }
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(done, function () { fallback(); });
    } else { fallback(); }
    function fallback() {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); done(); }
      catch (e) { showToast('复制失败，请手动选择'); }
      document.body.removeChild(ta);
    }
  }

  document.getElementById('uuidCopy').addEventListener('click', function () {
    copyText(uuidOutput.textContent, this);
  });
  document.getElementById('pwdCopy').addEventListener('click', function () {
    copyText(pwdOutput.textContent, this);
  });
  document.getElementById('base64Copy').addEventListener('click', function () {
    if (!base64Output.value) {
      showToast('暂无可复制内容');
      return;
    }
    copyText(base64Output.value, this);
  });

  function setBase64Result(value) {
    base64Output.value = value;
    base64Output.scrollTop = 0;
  }

  document.getElementById('base64Encode').addEventListener('click', function () {
    setBase64Result(encodeBase64(base64Input.value));
  });
  document.getElementById('base64Decode').addEventListener('click', function () {
    try {
      setBase64Result(decodeBase64(base64Input.value));
    } catch (e) {
      showToast('Base64 内容无效或不是 UTF-8 文本');
    }
  });
  document.getElementById('base64Swap').addEventListener('click', function () {
    var input = base64Input.value;
    base64Input.value = base64Output.value;
    base64Output.value = input;
  });
  function handleBase64Hotkey(e) {
    if (e.ctrlKey && e.key === 'Enter') {
      e.preventDefault();
      document.getElementById('base64Encode').click();
    }
  }
  base64Input.addEventListener('keydown', handleBase64Hotkey);
  document.getElementById('base64FileEncode').addEventListener('click', function () {
    base64FileInput.click();
  });
  base64FileInput.addEventListener('change', function () {
    var file = this.files && this.files[0];
    this.value = '';
    if (!file) return;
    if (file.size > MAX_FILE_SIZE) {
      showToast('文件不能超过 10 MiB');
      return;
    }
    var reader = new FileReader();
    reader.onload = function () {
      lastEncodedFileData = String(reader.result);
      lastEncodedFileName = file.name;
      setBase64Result(lastEncodedFileData);
      showToast('文件已编码');
    };
    reader.onerror = function () { showToast('文件读取失败'); };
    reader.readAsDataURL(file);
  });
  document.getElementById('base64FileDecode').addEventListener('click', function () {
    var source = base64Input.value.trim();
    if (!source) {
      showToast('请先输入 Base64 内容');
      return;
    }
    try {
      downloadBase64File(source);
      showToast('文件已生成');
    } catch (e) {
      showToast(e.message === 'File too large' ? '解码后的文件不能超过 10 MiB' : 'Base64 文件内容无效');
    }
  });

  document.getElementById('urlCopy').addEventListener('click', function () {
    if (!urlOutput.value) {
      showToast('暂无可复制内容');
      return;
    }
    copyText(urlOutput.value, this);
  });
  function showUrlResult(value) {
    urlOutput.value = value;
    urlOutput.scrollTop = 0;
    urlResult.classList.add('show');
  }
  document.getElementById('urlEncode').addEventListener('click', function () {
    var value = urlInput.value;
    if (!value) {
      showToast('请输入 URL 内容');
      return;
    }
    try {
      showUrlResult(encodeURIComponent(value));
    } catch (e) {
      showToast('输入内容包含无效字符');
    }
  });
  document.getElementById('urlDecode').addEventListener('click', function () {
    var value = urlInput.value;
    if (!value) {
      showToast('请输入 URL 内容');
      return;
    }
    try {
      showUrlResult(decodeURIComponent(value));
    } catch (e) {
      showToast('URL 编码内容无效');
    }
  });
  urlInput.addEventListener('input', function () {
    urlOutput.value = '';
    urlResult.classList.remove('show');
  });

  // UUID 版本切换
  document.getElementById('uuidVerSeg').addEventListener('click', function (e) {
    var btn = e.target.closest('button');
    if (!btn) return;
    uuidVer = parseInt(btn.getAttribute('data-ver'), 10);
    var btns = this.querySelectorAll('button');
    for (var i = 0; i < btns.length; i++) btns[i].classList.toggle('active', btns[i] === btn);
    refreshUUID();
  });

  // 密码长度切换
  document.getElementById('lenSeg').addEventListener('click', function (e) {
    var btn = e.target.closest('button');
    if (!btn) return;
    pwdLen = parseInt(btn.getAttribute('data-len'), 10);
    var btns = this.querySelectorAll('button');
    for (var i = 0; i < btns.length; i++) btns[i].classList.toggle('active', btns[i] === btn);
    refreshPassword();
  });

  bindRefresh('uuidRefresh', refreshUUID);
  bindRefresh('pwdRefresh', refreshPassword);

  // 初始生成（默认 v4）
  refreshUUID();
  refreshPassword();
})();
</script>
</body>
</html>
